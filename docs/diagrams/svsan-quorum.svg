<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-label="Without a witness, a link failure leaves both plexes online and diverging. With a witness, only the side holding two of three votes stays online."><rect width="940" height="300" fill="#ffffff"/>
    <text x="20" y="26" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#a30000" letter-spacing="0.5">WITHOUT WITNESS — ISOLATION POLICY “UP”</text>
    <rect x="20" y="46" width="150" height="62" rx="3" fill="#ffffff" stroke="#f0ab00" stroke-width="1.5"/>
    <text x="95" y="72" font-family="Red Hat Mono, monospace" font-size="12" fill="#795600" text-anchor="middle">vsa1</text>
    <text x="95" y="90" font-family="Red Hat Mono, monospace" font-size="10" fill="#a30000" text-anchor="middle">stays online</text>
    <rect x="250" y="46" width="150" height="62" rx="3" fill="#ffffff" stroke="#f0ab00" stroke-width="1.5"/>
    <text x="325" y="72" font-family="Red Hat Mono, monospace" font-size="12" fill="#795600" text-anchor="middle">vsa2</text>
    <text x="325" y="90" font-family="Red Hat Mono, monospace" font-size="10" fill="#a30000" text-anchor="middle">stays online</text>
    <path d="M175,77 L245,77" stroke="#ee0000" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M200,62 L220,92 M220,62 L200,92" stroke="#ee0000" stroke-width="2.4"/>
    <text x="210" y="132" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#a30000" text-anchor="middle">both writable · data diverges · split brain</text>

    <text x="520" y="26" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#004b95" letter-spacing="0.5">WITH WITNESS — ISOLATION POLICY “MAJORITY”</text>
    <rect x="520" y="46" width="150" height="62" rx="3" fill="#ffffff" stroke="#f0ab00" stroke-width="1.5"/>
    <text x="595" y="72" font-family="Red Hat Mono, monospace" font-size="12" fill="#795600" text-anchor="middle">vsa1</text>
    <text x="595" y="90" font-family="Red Hat Mono, monospace" font-size="10" fill="#004b95" text-anchor="middle">2 of 3 · online</text>
    <rect x="750" y="46" width="150" height="62" rx="3" fill="#f0f0f0" stroke="#d2d2d2" stroke-width="1.5"/>
    <text x="825" y="72" font-family="Red Hat Mono, monospace" font-size="12" fill="#6a6e73" text-anchor="middle">vsa2</text>
    <text x="825" y="90" font-family="Red Hat Mono, monospace" font-size="10" fill="#6a6e73" text-anchor="middle">1 of 3 · offline</text>
    <path d="M675,77 L745,77" stroke="#ee0000" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M700,62 L720,92 M720,62 L700,92" stroke="#ee0000" stroke-width="2.4"/>

    <rect x="635" y="176" width="170" height="58" rx="3" fill="#ffffff" stroke="#5752d1" stroke-width="1.5"/>
    <text x="720" y="199" font-family="Red Hat Mono, monospace" font-size="11" fill="#3c3d99" text-anchor="middle">nsh-witness</text>
    <text x="720" y="216" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73" text-anchor="middle">container · qnetd1 · :4174</text>
    <path d="M645,176 L600,112" stroke="#5752d1" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
    <path d="M795,176 L830,112" stroke="#5752d1" stroke-width="1.4" stroke-dasharray="5 4" fill="none" opacity="0.3"/>
    <text x="720" y="262" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#004b95" text-anchor="middle">one side keeps quorum · the other takes itself offline</text>
  </svg>
