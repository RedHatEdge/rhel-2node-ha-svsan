    <text x="1034" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#795600">90 G · SvSAN</text>
    <text x="744" y="584" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">SvSAN (option A) and DRBD (option B) hold separate volumes — both stacks coexist</text>

    <!-- raw block passthrough -->
    <path d="M424,520 L424,378" stroke="#f0ab00" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <text x="434" y="502" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#795600">raw block</text>
    <path d="M1096,520 L1096,378" stroke="#f0ab00" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
    <text x="1106" y="502" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#795600">raw block</text>

    <!-- NVMe -->
    <rect x="56" y="620" width="456" height="30" rx="2" fill="#f0f0f0" stroke="#d2d2d2"/>
    <text x="72" y="640" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">NVMe 953 GB (by-id) — physical volume</text>
    <rect x="728" y="620" width="456" height="30" rx="2" fill="#f0f0f0" stroke="#d2d2d2"/>
    <text x="744" y="640" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">NVMe 953 GB (by-id) — physical volume</text>

    <!-- host initiator -->
    <text x="52" y="668" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#004b95">iSCSI to its own VSA</text>
    <rect x="56" y="674" width="456" height="60" rx="3" fill="#ffffff" stroke="#0066cc" stroke-width="1.4"/>
    <text x="72" y="695" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#004b95">host iSCSI initiator · iscsid + multipathd</text>
    <text x="72" y="712" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#4d4d4d">logs in to its OWN VSA and to the peer — guests run on the mirrored LUN</text>
    <text x="72" y="726" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">iqn.2026-08.com.example.store:node1</text>

    <text x="1188" y="668" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#004b95" text-anchor="end">iSCSI to its own VSA</text>
    <rect x="728" y="674" width="456" height="60" rx="3" fill="#ffffff" stroke="#0066cc" stroke-width="1.4"/>
    <text x="744" y="695" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#004b95">host iSCSI initiator · iscsid + multipathd</text>
    <text x="744" y="712" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#4d4d4d">logs in to its OWN VSA and to the peer — guests run on the mirrored LUN</text>
    <text x="744" y="726" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">iqn.2026-08.com.example.store:node2</text>

