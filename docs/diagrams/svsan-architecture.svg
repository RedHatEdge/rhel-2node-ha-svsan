<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-label="Two RHEL 9 hosts each running a StorMagic VSA on LVM-backed storage, mirroring synchronously over a storage VLAN, with a witness container on a third RHEL host arbitrating quorum."><rect width="1240" height="880" fill="#ffffff"/>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
      </marker>
    </defs>

    <!-- witness, in the datacenter -->
    <rect x="440" y="16" width="360" height="128" rx="3" fill="#ffffff" stroke="#5752d1" stroke-width="1.5"/>
    <text x="458" y="40" font-family="Red Hat Mono, monospace" font-size="11" fill="#3c3d99" letter-spacing="0.8">DATACENTER · RHEL 9 ARBITER</text>
    <text x="458" y="60" font-family="Red Hat Mono, monospace" font-size="12.5" fill="#4d4d4d">qnetd1 · 172.16.7.20</text>
    <rect x="458" y="74" width="324" height="54" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="472" y="93" font-family="Red Hat Mono, monospace" font-size="12.5" fill="#151515">podman · nsh-witness</text>
    <text x="472" y="109" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">ubi9-minimal · smclusterd + smdiscod · :4174</text>
    <text x="472" y="122" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">systemd quadlet · corosync-qnetd :5403 alongside</text>

    <path d="M470,144 L300,236" stroke="#5752d1" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
    <path d="M770,144 L940,236" stroke="#5752d1" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
    <text x="332" y="196" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#3c3d99" text-anchor="end">mirror quorum</text>
    <text x="910" y="196" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#3c3d99">mirror quorum</text>

    <!-- host boundaries -->
    <rect x="34" y="230" width="500" height="600" rx="3" fill="#fafafa" stroke="#ee0000" stroke-width="1.6"/>
    <text x="52" y="257" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="500" fill="#a30000" letter-spacing="0.5">RHEL 9.8 HOST · node1</text>
    <text x="52" y="274" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#6a6e73">Simply NUC EE-2000 · 172.16.7.10</text>

    <rect x="706" y="230" width="500" height="600" rx="3" fill="#fafafa" stroke="#ee0000" stroke-width="1.6"/>
    <text x="724" y="257" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="500" fill="#a30000" letter-spacing="0.5">RHEL 9.8 HOST · node2</text>
    <text x="724" y="274" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#6a6e73">Simply NUC EE-2000 · 172.16.7.11</text>

    <!-- VSA guests -->
    <rect x="56" y="292" width="456" height="128" rx="3" fill="#ffffff" stroke="#f0ab00" stroke-width="1.6"/>
    <text x="72" y="315" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="500" fill="#795600">VSA guest · svsan-node1 “vsa1”</text>
    <text x="72" y="334" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">mgmt MAC 52:54:00:53:01:01 → serial 525400530101</text>
    <rect x="72" y="346" width="200" height="30" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="84" y="366" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#151515">journal · vdb 20 GB</text>
    <rect x="284" y="346" width="212" height="30" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="296" y="366" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#151515">pool1 · vdc 90 GB</text>
    <text x="72" y="399" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#004b95">iSCSI target :3260 → 172.18.8.20</text>
    <text x="72" y="412" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">all disks virtio · appliance reports “KVM:virtio4”</text>

    <rect x="728" y="292" width="456" height="128" rx="3" fill="#ffffff" stroke="#f0ab00" stroke-width="1.6"/>
    <text x="744" y="315" font-family="Red Hat Display, sans-serif" font-size="13" font-weight="500" fill="#795600">VSA guest · svsan-node2 “vsa2”</text>
    <text x="744" y="334" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">mgmt MAC 52:54:00:53:02:01 → serial 525400530201</text>
    <rect x="744" y="346" width="200" height="30" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="756" y="366" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#151515">journal · vdb 20 GB</text>
    <rect x="956" y="346" width="212" height="30" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="968" y="366" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#151515">pool1 · vdc 90 GB</text>
    <text x="744" y="399" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#004b95">iSCSI target :3260 → 172.18.8.21</text>
    <text x="744" y="412" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">all disks virtio · appliance reports “KVM:virtio4”</text>

    <!-- synchronous mirror -->
    <path d="M512,356 L728,356" stroke="#0066cc" stroke-width="2.4" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <rect x="534" y="316" width="172" height="34" rx="2" fill="#ffffff" stroke="#0066cc" stroke-width="1"/>
    <text x="620" y="332" font-family="Red Hat Mono, monospace" font-size="11" fill="#004b95" text-anchor="middle">synchronous mirror</text>
    <text x="620" y="345" font-family="Red Hat Mono, monospace" font-size="9" fill="#6a6e73" text-anchor="middle">write acked after both plexes</text>

    <!-- libvirt -->
    <rect x="56" y="436" width="456" height="34" rx="2" fill="#f0f0f0" stroke="#d2d2d2"/>
    <text x="72" y="458" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">libvirt / KVM — domain XML with MAC + PCI slots pinned</text>
    <rect x="728" y="436" width="456" height="34" rx="2" fill="#f0f0f0" stroke="#d2d2d2"/>
    <text x="744" y="458" font-family="Red Hat Mono, monospace" font-size="10.5" fill="#4d4d4d">libvirt / KVM — domain XML with MAC + PCI slots pinned</text>

    <!-- LVM -->
    <rect x="56" y="486" width="456" height="118" rx="3" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.4"/>
    <text x="72" y="508" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#151515">LVM volume group · vgstore · 953.87 GB</text>
    <rect x="72" y="520" width="132" height="40" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="82" y="537" font-family="Red Hat Mono, monospace" font-size="10" fill="#4d4d4d">lv-store-a</text>
    <text x="82" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">429 G · DRBD</text>
    <rect x="212" y="520" width="132" height="40" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="222" y="537" font-family="Red Hat Mono, monospace" font-size="10" fill="#4d4d4d">lv-store-b</text>
    <text x="222" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">429 G · DRBD</text>
    <rect x="352" y="520" width="144" height="40" rx="2" fill="#fdf7e7" stroke="#f0ab00" stroke-width="1.4"/>
    <text x="362" y="537" font-family="Red Hat Mono, monospace" font-size="10" fill="#795600">lv-svsan-pool</text>
    <text x="362" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#795600">90 G · SvSAN</text>
    <text x="72" y="584" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">SvSAN (option A) and DRBD (option B) hold separate volumes — both stacks coexist</text>

    <rect x="728" y="486" width="456" height="118" rx="3" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.4"/>
    <text x="744" y="508" font-family="Red Hat Display, sans-serif" font-size="12.5" font-weight="500" fill="#151515">LVM volume group · vgstore · 953.87 GB</text>
    <rect x="744" y="520" width="132" height="40" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="754" y="537" font-family="Red Hat Mono, monospace" font-size="10" fill="#4d4d4d">lv-store-a</text>
    <text x="754" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">429 G · DRBD</text>
    <rect x="884" y="520" width="132" height="40" rx="2" fill="#fafafa" stroke="#d2d2d2"/>
    <text x="894" y="537" font-family="Red Hat Mono, monospace" font-size="10" fill="#4d4d4d">lv-store-b</text>
    <text x="894" y="551" font-family="Red Hat Mono, monospace" font-size="9.5" fill="#6a6e73">429 G · DRBD</text>
