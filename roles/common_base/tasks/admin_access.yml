---
# Operator access: a named admin account and Cockpit on :9090.
#
# Store staff and field engineers are not going to drive a two-node cluster from
# pcs on a console. Cockpit gives them the guests (cockpit-machines), the
# containers (cockpit-podman) and the disks (cockpit-storaged) in a browser,
# which is what makes this handover-able.

- name: Install Cockpit and podman
  ansible.builtin.dnf:
    name:
      - cockpit
      - cockpit-ws
      - cockpit-system
      - cockpit-bridge
      - cockpit-machines
      - cockpit-podman
      - cockpit-storaged
      - cockpit-networkmanager
      - podman
    state: present
  # On an image-mode host these are already baked into the image; nothing
  # installed at runtime would survive a reboot anyway.
  when: not is_bootc | bool

- name: Create the admin group
  ansible.builtin.group:
    name: "{{ admin_user }}"
    state: present

- name: Locate the admin home
  ansible.builtin.set_fact:
    # Image-mode hosts put home directories under /var/home.
    _admin_home: "{{ '/var/home/' ~ admin_user if (is_bootc | bool) else '/home/' ~ admin_user }}"

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    group: "{{ admin_user }}"
    # wheel carries sudo; libvirt and podman let Cockpit manage guests and
    # containers as this user rather than pushing everyone to root.
    groups: "{{ admin_extra_groups | join(',') }}"
    append: true
    shell: /bin/bash
    create_home: true
    home: "{{ _admin_home }}"
    password: "{{ admin_password_hash | default(omit) }}"
    update_password: "{{ 'always' if admin_password_hash is defined else 'on_create' }}"
    state: present

- name: Authorise the admin SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_key }}"
    state: present
  when: admin_ssh_key | default('') | length > 0

# Inherit root's keys when none was given. Otherwise this role creates an
# account with a locked password and no key -- one that exists, reports
# success, and cannot be logged into by anybody.
- name: Fall back to root's authorised keys
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "{{ _admin_home }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: admin_ssh_key | default('') | length == 0
  failed_when: false

# An account with no password cannot use Cockpit at all: its login goes through
# PAM, not SSH keys. So a usable operator account needs BOTH -- a key for
# automation and a password for the browser.
- name: Refuse to leave the account unusable
  ansible.builtin.assert:
    that:
      - (admin_password_hash is defined) or (admin_ssh_key | default('') | length > 0)
    fail_msg: >-
      {{ admin_user }} would have neither a password nor an SSH key. Set
      admin_password_hash (Cockpit needs it) and/or admin_ssh_key, or this
      account cannot be logged into. Generate a hash with:
      mkpasswd --method=yescrypt

# NOPASSWD is deliberate and worth a moment's thought. Cockpit will prompt for
# the password for privileged actions when the account has one, which is the
# better default for an interactive operator. This entry exists so automation
# and break-glass console work do not stall on a prompt.
- name: Grant sudo to the admin group
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ admin_user }}"
    mode: "0440"
    owner: root
    group: root
    content: |
      %{{ admin_user }} ALL=(ALL) NOPASSWD:ALL
    validate: 'visudo -cf %s'

- name: Check whether Cockpit is present
  ansible.builtin.command: rpm -q cockpit
  register: _cockpit_rpm
  changed_when: false
  failed_when: false

# On an image-mode host Cockpit has to come from the image. Saying so beats
# failing on `systemctl enable cockpit.socket` for a unit that does not exist,
# and beats installing it at runtime into a layer the next reboot discards.
- name: Explain what is needed when Cockpit is missing from the image
  ansible.builtin.debug:
    msg: >-
      Cockpit is not in this image. Rebuild it (bootc/build.sh) with the cockpit
      layer, then `bootc upgrade` and reboot each node. Skipping the Cockpit
      steps; the {{ admin_user }} account has still been configured.
  when:
    - is_bootc | bool
    - _cockpit_rpm.rc != 0

# root needs a password too, and for a specific reason: Cockpit authenticates
# through PAM. A key-only root cannot log into the web UI, and on a console --
# the one place you end up when the network is broken -- a locked root leaves no
# way in at all. Keys remain the way in over SSH; this is the fallback.
- name: Set the root password
  ansible.builtin.user:
    name: root
    password: "{{ root_password_hash }}"
    update_password: always
  when: root_password_hash is defined
  no_log: true

# Cockpit's Machines page drives libvirt, and RHEL 9 can run libvirt two ways:
# the monolithic libvirtd, or the modular per-driver daemons (virtqemud and
# friends). Both work for virsh, which is why "virsh lists the guests" is NOT a
# valid check that Cockpit will see them -- virsh talks to whichever is running.
#
# cockpit-machines 3xx drives the MODULAR daemons. On a host where libvirtd is
# running instead, its Machines page reports "Virtualization service (libvirt) is
# not active" and shows nothing, while virsh on the same box lists every guest.
#
# The two modes conflict, so enforce one. Modular is correct for current
# cockpit-machines and is RHEL 9's default; a host that has been switched to
# monolithic -- or an older image that shipped that way -- needs moving back.
- name: Stop the monolithic libvirt daemon
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - libvirtd.service
    - libvirtd.socket
    - libvirtd-ro.socket
  failed_when: false
  when: libvirt_modular | default(true) | bool

- name: Enable the modular libvirt daemons for Cockpit
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - virtqemud.socket
    - virtnetworkd.socket
    - virtstoraged.socket
    - virtnodedevd.socket
  failed_when: false
  when: libvirt_modular | default(true) | bool

# Check the SOCKET, not the service. virtqemud is socket-activated: the service
# sits inactive until something connects, so testing the service right after
# enabling it reports "inactive" on a perfectly healthy host. The socket being
# listening is what determines whether Cockpit can reach libvirt.
- name: Confirm the socket Cockpit connects to is listening
  ansible.builtin.command: systemctl is-active virtqemud.socket
  register: _virtqemud
  changed_when: false
  failed_when: false

- name: Report whether Cockpit will see the guests
  ansible.builtin.debug:
    msg: >-
      {{ 'virtqemud.socket listening — Cockpit Machines will list the guests.'
         if _virtqemud.stdout | trim == 'active'
         else 'virtqemud.socket is ' ~ (_virtqemud.stdout | trim) ~ ' — Cockpit Machines will report
               "Virtualization service (libvirt) is not active" even though virsh works.' }}

- name: Enable Cockpit
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  when: _cockpit_rpm.rc == 0

- name: Open Cockpit on the management network only
  ansible.posix.firewalld:
    service: cockpit
    zone: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ cockpit_firewall_zones }}"
  when: _cockpit_rpm.rc == 0

- name: Report where Cockpit is reachable
  ansible.builtin.debug:
    msg: "Cockpit: https://{{ lan_ip | default(ansible_default_ipv4.address) }}:9090  (user: {{ admin_user }})"
  when: _cockpit_rpm.rc == 0
